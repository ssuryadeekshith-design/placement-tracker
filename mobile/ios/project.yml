name: Shikshavertex
options:
  bundleIdPrefix: in.shikshavertex
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
targets:
  Shikshavertex:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.shikshavertex.attendance
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Shikshavertex.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShikshavertexTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Shikshavertex
schemes:
  Shikshavertex:
    build:
      targets:
        Shikshavertex: all
    test:
      targets: [ShikshavertexTests]
