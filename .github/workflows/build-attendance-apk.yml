name: Build attendance APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-attendance-apk.yml'
      - 'mobile/android/**'
      - 'scripts/android/**'

concurrency:
  group: attendance-signed-build
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check the Android release candidate
        working-directory: mobile/android
        run: bash gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease -PATTENDANCE_API_URL=https://placement-tracker-lyjf.onrender.com/api
      - name: Test the portable signer with disposable keys
        run: python3 scripts/android/test-signing-bundle.py --apk mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
      - name: Prepare the private-local-signing setup bundle
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, zipfile
          apk = pathlib.Path('mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk')
          endpoint = 'https://placement-tracker-lyjf.onrender.com/api'
          with zipfile.ZipFile(apk) as archive:
              dex = [name for name in archive.namelist() if name.startswith('classes') and name.endswith('.dex')]
              if not any(endpoint.encode() in archive.read(name) for name in dex):
                  raise SystemExit('Hosted API configuration missing from the APK.')
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          package = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True).splitlines()[0]
          if not all(text in package for text in ["name='in.shikshavertex.attendance'", "versionName='1.10'", "versionCode='11'"]):
              raise SystemExit('Unexpected package/version. Setup bundle will not be published.')
          target = pathlib.Path('attendance-new-install-setup')
          target.mkdir()
          shutil.copyfile(apk, target / 'attendance-1.10-unsigned.apk')
          shutil.copyfile('scripts/android/sign-fresh-attendance.sh', target / 'sign-fresh-attendance.sh')
          shutil.copyfile('scripts/android/SETUP-README.txt', target / 'READ-ME-FIRST.txt')
          shutil.copyfile('mobile/android/signing-certificate.sha256', target / 'signing-certificate.sha256')
          shutil.copyfile(tools / 'lib/apksigner.jar', target / 'apksigner.jar')
          shutil.copyfile(tools / 'NOTICE.txt', target / 'Android-Build-Tools-NOTICE.txt')
          (target / 'unsigned.sha256').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '\n')
          (target / 'build-info.txt').write_text(f"{package}\nCommit: {os.environ['GITHUB_SHA']}\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\nAttendance API: {endpoint}\nUNSIGNED SETUP CANDIDATE: not installable; run the local signing script with the existing pinned release key.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-new-install-setup
          path: attendance-new-install-setup/
          if-no-files-found: error
      - name: Restore a pinned owner key if CI signing is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          supplied = [name for name in names if os.environ.get(name)]
          if not supplied:
              print('No CI signing key configured. Download attendance-new-install-setup and sign locally. No private key was generated on the runner.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ready=false\n')
          else:
              if len(supplied) != len(names):
                  raise SystemExit('Signing secrets are incomplete. No key fallback or replacement will be used.')
              expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
              if not re.fullmatch('[0-9A-F]{64}', expected):
                  raise SystemExit('The new owner certificate must be pinned before CI may publish a signed APK. Follow docs/android-signing-setup.md.')
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'attendance-signing.keystore'
              target.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ready=true\n')
          PY
      - name: Confirm the pinned new certificate
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore "$RUNNER_TEMP/attendance-signing.keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/attendance-signing.der"
          python3 - <<'PY'
          import hashlib, os, pathlib
          expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
          actual = hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP']) / 'attendance-signing.der').read_bytes()).hexdigest().upper()
          if actual != expected:
              raise SystemExit('The key does not match the pinned new release certificate. No signed APK will be published.')
          PY
      - name: Sign with the pinned owner key
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/attendance-signing.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out attendance-1.10.apk attendance-new-install-setup/attendance-1.10-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs attendance-1.10.apk > certificate.txt
          python3 - <<'PY'
          import pathlib, re
          expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
          match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', pathlib.Path('certificate.txt').read_text())
          if not match or match.group(1).upper() != expected:
              raise SystemExit('APK certificate mismatch. No signed artifact will be published.')
          pathlib.Path('render-passkeys.env').write_text('ANDROID_SHA256_CERT_FINGERPRINTS=' + expected + '\n')
          PY
          cp attendance-new-install-setup/build-info.txt build-info.txt
          python3 - <<'PY'
          from pathlib import Path
          info = Path('build-info.txt')
          info.write_text(info.read_text().replace('UNSIGNED SETUP CANDIDATE: not installable; run the local signing script with the existing pinned release key.', 'SIGNED INSTALLER: verified against the pinned owner certificate. Update an existing installation only when it uses the same signing key.'))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: attendance-android
          path: |
            attendance-1.10.apk
            certificate.txt
            render-passkeys.env
            build-info.txt
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/attendance-signing.keystore" "$RUNNER_TEMP/attendance-signing.der"

  publish:
    name: Publish verified APK download
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure signature verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - uses: actions/download-artifact@v4
        with:
          name: attendance-android
          path: release
      - name: Verify and prepare the public installer
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess
          folder = pathlib.Path('release')
          apk = folder / 'attendance-1.10.apk'
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          certificate = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', certificate)
          if not actual or actual.group(1).upper() != expected:
              raise SystemExit('Downloaded APK does not match the pinned release key. Publication stopped.')
          package = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True).splitlines()[0]
          if not all(value in package for value in ["name='in.shikshavertex.attendance'", "versionName='1.10'", "versionCode='11'"]):
              raise SystemExit('Unexpected Android package or version. Publication stopped.')
          target = folder / 'attendance.apk'
          target.write_bytes(apk.read_bytes())
          (folder / 'SHA256SUMS').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  attendance.apk\n')
          (folder / 'certificate.txt').write_text(certificate)
          (folder / 'release-notes.md').write_text(
              'Install **attendance.apk** directly on Android 9 or later. Share this installer or its download link as a WhatsApp document/link; no ZIP extraction is needed.\n\n'
              'Version 1.10 shows a connecting notice while the server starts, alongside office-readiness indicators and confirmed attendance animations. The app opens anywhere; self check-in requires venue presence, the approved office connection and phone verification. Room codes remain removed.\n\n'
              'Updates use the existing pinned signing identity. Existing server attendance records are retained.\n\n'
              f"Source commit: `{os.environ['GITHUB_SHA']}`\n\n"
              f'Signing certificate SHA-256: `{expected}`\n')
          PY
      - name: Publish the signed installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="attendance-v1.10-${GITHUB_SHA:0:7}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = 'true' ]; then
              gh release upload "$release_tag" release/attendance.apk release/SHA256SUMS release/certificate.txt release/build-info.txt --clobber
              gh release edit "$release_tag" --draft=false --latest
            else
              echo 'This signed release already exists; its files are preserved.'
            fi
          else
            gh release create "$release_tag" release/attendance.apk release/SHA256SUMS release/certificate.txt release/build-info.txt \
              --target "$GITHUB_SHA" --title 'Shikshavertex Attendance 1.10' --notes-file release/release-notes.md --draft
            gh release edit "$release_tag" --draft=false --latest
          fi
          printf 'Direct Android installer: https://github.com/%s/releases/latest/download/attendance.apk\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
