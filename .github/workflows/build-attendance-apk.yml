name: Build attendance APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-attendance-apk.yml'
      - 'mobile/android/**'
      - 'scripts/android/**'

concurrency:
  group: attendance-signed-build
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check the approved fresh-install release candidate
        working-directory: mobile/android
        run: bash gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease -PATTENDANCE_API_URL=https://placement-tracker-lyjf.onrender.com/api
      - name: Test the portable signer with disposable keys
        run: python3 scripts/android/test-signing-bundle.py --apk mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
      - name: Prepare the private-local-signing setup bundle
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, zipfile
          apk = pathlib.Path('mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk')
          endpoint = 'https://placement-tracker-lyjf.onrender.com/api'
          with zipfile.ZipFile(apk) as archive:
              dex = [name for name in archive.namelist() if name.startswith('classes') and name.endswith('.dex')]
              if not any(endpoint.encode() in archive.read(name) for name in dex):
                  raise SystemExit('Hosted API configuration missing from the APK.')
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          package = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True).splitlines()[0]
          if not all(text in package for text in ["name='in.shikshavertex.attendance'", "versionName='1.7'", "versionCode='8'"]):
              raise SystemExit('Unexpected package/version. Setup bundle will not be published.')
          target = pathlib.Path('attendance-new-install-setup')
          target.mkdir()
          shutil.copyfile(apk, target / 'attendance-1.7-unsigned.apk')
          shutil.copyfile('scripts/android/sign-fresh-attendance.sh', target / 'sign-fresh-attendance.sh')
          shutil.copyfile('scripts/android/SETUP-README.txt', target / 'READ-ME-FIRST.txt')
          shutil.copyfile('mobile/android/signing-certificate.sha256', target / 'signing-certificate.sha256')
          shutil.copyfile(tools / 'lib/apksigner.jar', target / 'apksigner.jar')
          shutil.copyfile(tools / 'NOTICE.txt', target / 'Android-Build-Tools-NOTICE.txt')
          (target / 'unsigned.sha256').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '\n')
          (target / 'build-info.txt').write_text(f"{package}\nCommit: {os.environ['GITHUB_SHA']}\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\nAttendance API: {endpoint}\nFRESH INSTALL MIGRATION: unsigned candidate; run the local signing script, back up the key and configure server association before installation.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-new-install-setup
          path: attendance-new-install-setup/
          if-no-files-found: error
      - name: Restore a pinned owner key if CI signing is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          supplied = [name for name in names if os.environ.get(name)]
          if not supplied:
              print('No CI signing key configured. Download attendance-new-install-setup and sign locally. No private key was generated on the runner.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ready=false\n')
          else:
              if len(supplied) != len(names):
                  raise SystemExit('Signing secrets are incomplete. No key fallback or replacement will be used.')
              expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
              if not re.fullmatch('[0-9A-F]{64}', expected):
                  raise SystemExit('The new owner certificate must be pinned before CI may publish a signed APK. Follow docs/android-signing-setup.md.')
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'attendance-signing.keystore'
              target.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ready=true\n')
          PY
      - name: Confirm the pinned new certificate
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore "$RUNNER_TEMP/attendance-signing.keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/attendance-signing.der"
          python3 - <<'PY'
          import hashlib, os, pathlib
          expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
          actual = hashlib.sha256((pathlib.Path(os.environ['RUNNER_TEMP']) / 'attendance-signing.der').read_bytes()).hexdigest().upper()
          if actual != expected:
              raise SystemExit('The key does not match the pinned new release certificate. No signed APK will be published.')
          PY
      - name: Sign with the pinned owner key
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/attendance-signing.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out attendance-1.7.apk attendance-new-install-setup/attendance-1.7-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs attendance-1.7.apk > certificate.txt
          python3 - <<'PY'
          import pathlib, re
          expected = pathlib.Path('mobile/android/signing-certificate.sha256').read_text().strip().replace(':', '').upper()
          match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', pathlib.Path('certificate.txt').read_text())
          if not match or match.group(1).upper() != expected:
              raise SystemExit('APK certificate mismatch. No signed artifact will be published.')
          pathlib.Path('render-passkeys.env').write_text('ANDROID_SHA256_CERT_FINGERPRINTS=' + expected + '\n')
          PY
          cp attendance-new-install-setup/build-info.txt build-info.txt
          printf '\nSigned with the pinned owner key; reinstall migration and hosted association validation required.\n' >> build-info.txt
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: attendance-android
          path: |
            attendance-1.7.apk
            certificate.txt
            render-passkeys.env
            build-info.txt
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/attendance-signing.keystore" "$RUNNER_TEMP/attendance-signing.der"
