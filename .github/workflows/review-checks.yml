name: Review integration checks
on:
  pull_request:
  push:
    branches: [codex/remaining-enterprise-views]
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm test --prefix server
      - run: npm test --prefix client -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build --prefix client
        env:
          CI: 'true'
      - name: Full app with fixture Firebase provider and in-memory API
        run: node client/scripts/check-workspace.cjs
  android-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile, unit test and lint without assembling an APK
        working-directory: mobile/android
        run: bash gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
