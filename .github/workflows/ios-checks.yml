name: iPhone app checks
on:
  workflow_dispatch:
  push:
    branches: [main, codex/remaining-enterprise-views]
    paths: ['mobile/ios/**', '.github/workflows/ios-checks.yml']
  pull_request:
    paths: ['mobile/ios/**', '.github/workflows/ios-checks.yml']
permissions:
  contents: read
concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build and test on an available iPhone simulator
        working-directory: mobile/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcodebuild -project Shikshavertex.xcodeproj -scheme Shikshavertex -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: mobile/ios/build/TestResults.xcresult
          if-no-files-found: ignore
